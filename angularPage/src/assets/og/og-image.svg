  <text x="360" y="521" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ddd6fe" text-anchor="middle">100% privado</text>

  <rect x="462" y="486" width="168" height="56" rx="28" fill="rgba(139,92,246,0.16)" stroke="rgba(139,92,246,0.5)" stroke-width="2" />
  <text x="546" y="521" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ddd6fe" text-anchor="middle">Gratis</text>


  <rect width="1200" height="630" fill="url(#glow2)" />

  <!-- App icon badge -->
  <rect x="90" y="120" width="96" height="96" rx="24" fill="#15172b" stroke="rgba(226,232,240,0.18)" stroke-width="2" />
  <text x="138" y="186" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#a78bfa" text-anchor="middle">$</text>


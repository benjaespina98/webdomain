  <text x="90" y="320" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#f8fafc">Dividí gastos grupales</text>
  <text x="90" y="386" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#c4b5fd">en segundos, sin registro</text>


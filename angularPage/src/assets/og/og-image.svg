    <text x="200" y="148" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="end">$108</text>

    <rect x="24" y="184" width="212" height="2" fill="rgba(148,163,184,0.18)" />

    <text x="24" y="220" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#94a3b8">TRANSFERENCIA SUGERIDA</text>


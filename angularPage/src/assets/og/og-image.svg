    <text x="36" y="262" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e2e8f0">Bruno le debe a Ana</text>
    <text x="36" y="286" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#ddd6fe">$108,00</text>

    <rect x="24" y="312" width="212" height="2" fill="rgba(148,163,184,0.18)" />
    <rect x="24" y="328" width="212" height="2" fill="rgba(148,163,184,0.0)" />

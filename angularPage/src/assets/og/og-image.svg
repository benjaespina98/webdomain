      <stop offset="55%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="glow1" cx="85%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />

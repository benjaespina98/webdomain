name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angularPage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: angularPage/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI

      - name: Build de producción
        run: npm run build

      # El CSP de vercel.json no permite scripts inline: si el build vuelve a generar
      # un `onload=` (carga diferida del CSS de Angular), el navegador lo bloquea.
      - name: El index.html no tiene handlers inline (CSP)
        run: "! grep -q 'onload=' dist/angular-page/index.html"

version: 2
updates:
  - package-ecosystem: npm
    directory: /angularPage
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@angular-eslint/*", "zone.js", "typescript"]
      testing:
        patterns: ["karma*", "jasmine*", "@types/jasmine"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
